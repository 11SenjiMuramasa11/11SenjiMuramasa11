<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@700&display=block" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; }
  /* same browser frame as the portfolio's project cards */
  .card {
    width: 520px;
    border-radius: 14px;
    overflow: hidden;
    background: #0a0a0a;
    border: 1px solid rgba(201,168,106,.35);
  }
  .bar {
    height: 30px; display: flex; align-items: center; gap: 6px; padding: 0 12px;
    border-bottom: 1px solid rgba(201,168,106,.2);
    font-family: "Nunito Sans", sans-serif; font-weight: 700; font-size: 10px; letter-spacing: .14em;
    text-transform: uppercase; color: rgba(185,203,214,.6);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(201,168,106,.45); }
  .bar span:last-child { margin-left: 10px; }
  .shot { position: relative; height: 250px; overflow: hidden; }
  /* bleed 3px past each edge to drop the border baked into some screenshots */
  .shot img { position: absolute; left: -3px; top: -3px; width: calc(100% + 6px); height: calc(100% + 6px); object-fit: cover; object-position: top; }
</style>
</head>
<body>
<div class="card">
  <div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span>__TITLE__</span></div>
  <div class="shot"><img src="__SHOT__" alt="" /></div>
</div>
</body>
</html>
