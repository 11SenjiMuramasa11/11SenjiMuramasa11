<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@800&display=block" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; }
  /* dark fill so the gold text reads on GitHub's light theme too */
  .card {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    height: 40px;
    padding: 0 22px;
    border: 1.5px solid rgba(201,168,106,.75);
    border-radius: 999px;
    background: #0a0a0a;
    font-family: "Nunito Sans", sans-serif;
    font-size: 11.5px;
    font-weight: 800;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: #f0dcab;
    white-space: nowrap;
  }
  .dot { width: 6px; height: 6px; background: #c9a86a; transform: rotate(45deg); }
</style>
</head>
<body>
<div class="card"><span class="dot"></span>__LABEL__</div>
</body>
</html>
