<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Profile hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Nunito+Sans:wght@300;400;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --navy-0: #050d20;
    --navy-1: #0a1834;
    --navy-2: #12264d;
    --gold: #c8a45b;
    --gold-light: #e7d19a;
    --gold-deep: #9b7332;
    --paper: #f7efdf;
    --muted: rgba(233, 239, 255, .68);
    --display: "Cormorant Garamond", Georgia, serif;
    --body: "Nunito Sans", "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 1000px;
    height: 420px;
    overflow: hidden;
    background: var(--navy-0);
  }

  .hero {
    position: relative;
    width: 1000px;
    height: 420px;
    overflow: hidden;
    background:
      radial-gradient(120% 150% at 78% 18%, rgba(36, 72, 132, .55) 0%, rgba(12, 26, 56, .2) 46%, transparent 70%),
      radial-gradient(90% 120% at 8% 100%, rgba(18, 38, 77, .9) 0%, transparent 62%),
      linear-gradient(160deg, #081226 0%, #0a1834 48%, #071026 100%);
    color: var(--paper);
    font-family: var(--body);
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
  }

  /* faint grid, like a chart of stars */
  .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(200, 164, 91, .045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(200, 164, 91, .045) 1px, transparent 1px);
    background-size: 50px 50px;
    mask-image: radial-gradient(120% 100% at 50% 40%, #000 30%, transparent 78%);
  }

  .stars { position: absolute; inset: 0; }
  .stars i {
    position: absolute;
    border-radius: 50%;
    background: #eaf1ff;
  }

  .constellation {
    position: absolute;
    inset: 0;
    opacity: .5;
  }

  /* ghost monogram */
  .monogram {
    display: none;
  }

  /* frame */
  .frame {
    position: absolute;
    inset: 14px;
    border: 1px solid rgba(200, 164, 91, .38);
    pointer-events: none;
  }
  .frame::after {
    content: "";
    position: absolute;
    inset: 5px;
    border: 1px solid rgba(200, 164, 91, .13);
  }

  .corner {
    position: absolute;
    width: 26px;
    height: 26px;
    border-color: var(--gold);
    border-style: solid;
    opacity: .85;
  }
  .corner.tl { top: 8px; left: 8px; border-width: 2px 0 0 2px; }
  .corner.tr { top: 8px; right: 8px; border-width: 2px 2px 0 0; }
  .corner.bl { bottom: 8px; left: 8px; border-width: 0 0 2px 2px; }
  .corner.br { bottom: 8px; right: 8px; border-width: 0 2px 2px 0; }

  .content {
    position: absolute;
    left: 64px;
    top: 52px;
    width: 600px;
  }

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--gold);
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: .3em;
    text-transform: uppercase;
  }
  .eyebrow::before {
    content: "";
    width: 26px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold));
  }

  h1 {
    margin-top: 16px;
    font-family: var(--display);
    font-size: 62px;
    font-weight: 600;
    line-height: .96;
    letter-spacing: -.012em;
    color: #fdf6e6;
    text-shadow: 0 2px 24px rgba(0, 0, 0, .35);
  }

  .alias {
    margin-top: 10px;
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .52em;
    text-transform: uppercase;
    color: var(--gold-light);
  }
  .alias .rule {
    width: 54px;
    height: 1px;
    background: linear-gradient(90deg, rgba(200, 164, 91, .1), rgba(200, 164, 91, .85));
  }

  .role {
    margin-top: 22px;
    font-size: 17px;
    font-weight: 400;
    letter-spacing: .015em;
    color: rgba(247, 239, 223, .92);
  }
  .role b { font-weight: 600; color: #fff8e7; }

  .sig {
    margin-top: 7px;
    font-family: var(--display);
    font-style: italic;
    font-size: 19px;
    color: rgba(231, 209, 154, .78);
  }

  .portrait {
    position: absolute;
    right: 80px;
    top: 72px;
    width: 188px;
    height: 188px;
    display: grid;
    place-items: center;
  }
  .portrait .halo {
    position: absolute;
    inset: -20px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(200, 164, 91, .2) 0%, rgba(200, 164, 91, .05) 48%, transparent 70%);
  }
  .portrait .ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid rgba(231, 209, 154, .85);
    box-shadow:
      0 0 0 1px rgba(90, 66, 24, .55),
      0 0 0 9px rgba(200, 164, 91, .1),
      0 0 0 10px rgba(200, 164, 91, .22);
    z-index: 2;
  }
  .portrait .ring::after {
    content: "";
    position: absolute;
    inset: -15px;
    border-radius: 50%;
    border: 1px solid rgba(200, 164, 91, .28);
  }
  .portrait img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    transform: scale(1.12);
    transform-origin: 50% 42%;
    filter: saturate(1.02) contrast(1.02);
  }
  .stud {
    position: absolute;
    width: 6px;
    height: 6px;
    background: var(--gold-light);
    transform: rotate(45deg);
    box-shadow: 0 0 8px rgba(231, 209, 154, .7);
  }
  .stud.n { top: -20px; left: calc(50% - 3px); }
  .stud.s { bottom: -20px; left: calc(50% - 3px); }
  .stud.e { right: -20px; top: calc(50% - 3px); }
  .stud.w { left: -20px; top: calc(50% - 3px); }

  .facts {
    position: absolute;
    left: 64px;
    right: 64px;
    bottom: 40px;
    display: flex;
    align-items: center;
    gap: 18px;
    color: rgba(233, 239, 255, .62);
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: .22em;
    text-transform: uppercase;
  }
  .facts .sep {
    width: 4px;
    height: 4px;
    background: var(--gold);
    transform: rotate(45deg);
    opacity: .8;
  }
  .facts .end {
    margin-left: auto;
    color: rgba(200, 164, 91, .8);
  }
</style>
</head>
<body>
  <div class="hero">
    <div class="grid"></div>
    <div class="stars" id="stars"></div>

    <svg class="constellation" viewBox="0 0 1000 420" fill="none" aria-hidden="true">
      <g stroke="rgba(200,164,91,.2)" stroke-width="1">
        <path d="M690 70 L760 118 L716 178 L792 214" />
      </g>
      <g fill="rgba(231,209,154,.5)">
        <circle cx="690" cy="70" r="1.8" />
        <circle cx="760" cy="118" r="1.4" />
        <circle cx="716" cy="178" r="1.6" />
        <circle cx="792" cy="214" r="1.2" />
      </g>
    </svg>

    <div class="monogram" aria-hidden="true">M</div>

    <div class="frame"></div>
    <span class="corner tl"></span>
    <span class="corner tr"></span>
    <span class="corner bl"></span>
    <span class="corner br"></span>

    <div class="content">
      <div class="eyebrow">01 — GitHub @11SenjiMuramasa11</div>
      <h1>Justine James Prades</h1>
      <div class="alias"><span class="rule"></span>Muramasa</div>
      <div class="role"><b>Software developer</b> &amp; QA</div>
      <div class="sig">I build the API, then try to break it.</div>
    </div>

    <div class="portrait">
      <div class="halo"></div>
      <img src="../../assets/avatar-cropped.png" alt="" />
      <div class="ring"></div>
      <span class="stud n"></span>
      <span class="stud s"></span>
      <span class="stud e"></span>
      <span class="stud w"></span>
    </div>

    <div class="facts">
      <span>BSIT · NU Laguna</span>
      <span class="sep"></span>
      <span>4 projects</span>
      <span class="sep"></span>
      <span>Laravel / React / Node.js</span>
      <span class="end">Profile</span>
    </div>
  </div>

  <script>
    // Deterministic starfield: same render every time.
    let seed = 20260526;
    const rand = () => {
      seed = (seed * 1664525 + 1013904223) % 4294967296;
      return seed / 4294967296;
    };
    const stars = document.getElementById("stars");
    for (let i = 0; i < 110; i += 1) {
      const s = document.createElement("i");
      const size = rand() < 0.82 ? 1 : 2;
      s.style.left = (rand() * 1000).toFixed(1) + "px";
      s.style.top = (rand() * 420).toFixed(1) + "px";
      s.style.width = size + "px";
      s.style.height = size + "px";
      s.style.opacity = (0.18 + rand() * 0.5).toFixed(2);
      stars.appendChild(s);
    }
  </script>
</body>
</html>
