<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,900&family=Nunito+Sans:wght@600;700&display=block" rel="stylesheet" />
<style>
  /* The portfolio's opening screen without the menu and info panel: those are the nav bar and About card in the README. */
  :root { --bg: #0e0e12; --fg: #fff; --gold: #d9b66a; --gold-hi: #f0dcab; --text-2: rgba(255,255,255,.74); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; }
  .card { position: relative; width: 1200px; height: 560px; border-radius: 14px; overflow: hidden; background: var(--bg); font-family: "Nunito Sans", sans-serif; color: var(--text-2); }
  .frame { position: absolute; inset: 10px; border: 1px solid rgba(217,182,106,.16); border-radius: 6px; z-index: 6; }
  .corner { position: absolute; width: 40px; height: 40px; color: var(--gold); opacity: .7; }
  .corner svg { width: 100%; height: 100%; display: block; }
  .tl { top: -1px; left: -1px; } .tr { top: -1px; right: -1px; transform: scaleX(-1); }
  .bl { bottom: -1px; left: -1px; transform: scaleY(-1); } .br { bottom: -1px; right: -1px; transform: scale(-1); }

  .brand { position: absolute; top: 30px; left: 34px; z-index: 6; font-size: 12px; font-weight: 600; letter-spacing: .14em; color: var(--gold); }
  .role { position: absolute; top: 30px; right: 34px; z-index: 6; font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--text-2); }

  .name { position: absolute; z-index: 1; font-family: "Archivo", sans-serif; font-weight: 900; font-stretch: 125%; font-size: 132px; line-height: .8; letter-spacing: -.02em; color: var(--fg); white-space: nowrap; }
  .back { left: 120px; top: 118px; }
  .front { right: 120px; top: 322px; z-index: 3; }
  .photo { position: absolute; z-index: 2; bottom: -70px; left: 600px; transform: translateX(-50%); height: 600px;
    -webkit-mask-image: linear-gradient(to bottom, #000 78%, transparent 96%); }

  .socials { position: absolute; z-index: 6; left: 34px; bottom: 32px; display: flex; gap: 9px; }
  .socials span { width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgba(255,255,255,.16); background: rgba(14,14,18,.8); display: grid; place-items: center; color: var(--gold); }
  .socials svg { width: 15px; height: 15px; }
  .cv { position: absolute; z-index: 6; right: 34px; bottom: 32px; display: inline-flex; align-items: center; gap: 8px; padding: 9px 20px; border-radius: 999px; border: 1px solid var(--gold);
    background: rgba(14,14,18,.8); color: var(--gold-hi); font-size: 12px; font-weight: 700; letter-spacing: .12em; }
  .cv svg { width: 14px; height: 14px; }
</style>
</head>
<body>
<div class="card">
  <div class="frame">__CORNERS__</div>
  <div class="brand">PORTFOLIO</div>
  <div class="role">Backend Developer &amp; QA Engineer</div>
  <div class="name back">JUSTINE</div>
  <img class="photo" src="__PHOTO__" alt="" />
  <div class="name front">PRADES</div>
  <div class="socials"><span>__I_GITHUB__</span><span>__I_LINKEDIN__</span><span>__I_MAIL__</span></div>
  <div class="cv">__I_FILE__VIEW CV</div>
</div>
</body>
</html>
