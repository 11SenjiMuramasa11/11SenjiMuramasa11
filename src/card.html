<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@110..125,700..900&family=JetBrains+Mono:wght@500;700&family=Nunito+Sans:wght@400;600;700&display=block" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; }
  :root { --gold: #c9a86a; --gold-hi: #f0dcab; --cream: #f1f5f9; --text: rgba(203,213,225,.82); --muted: rgba(148,163,184,.75); --line: rgba(201,168,106,.14); }
  .card {
    width: 1000px; padding: 44px 48px 48px;
    border-radius: 18px; background: #0a0a0a; border: 1px solid rgba(201,168,106,.2);
    font-family: "Nunito Sans", sans-serif; color: var(--text); font-size: 15px; line-height: 1.6;
  }
  .mono { font-family: "JetBrains Mono", monospace; font-size: 10.5px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; }
  .eyebrow { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; }
  .eyebrow b { color: var(--gold); font-weight: 700; display: inline-flex; align-items: center; gap: 10px; }
  .eyebrow b::before { content: ""; width: 6px; height: 6px; background: var(--gold); transform: rotate(45deg); }
  .eyebrow span { color: rgba(148,163,184,.5); font-size: 9.5px; }
  h2 { font-family: "Archivo", sans-serif; font-weight: 900; font-stretch: 125%; font-size: 46px; line-height: 1; letter-spacing: -.03em; color: var(--cream); }
  h2 i { font-style: normal; color: var(--gold); }
  .sub { margin-top: 12px; color: var(--muted); }
  .rows > * { border-top: 1px solid var(--line); }
  .label { color: rgba(148,163,184,.6); font-size: 9.5px; }
  .gold { color: var(--gold); }
  .pill { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 13px; border-radius: 999px;
    border: 1px solid rgba(201,168,106,.22); background: #101010; color: var(--cream); font-size: 13.5px; font-weight: 600; white-space: nowrap; }
  .pill svg { width: 15px; height: 15px; flex-shrink: 0; }
  /* card-specific layouts */
  .statement { font-family: "Archivo", sans-serif; font-weight: 800; font-stretch: 110%; font-size: 29px; line-height: 1.28; letter-spacing: -.015em; color: var(--cream); margin: 6px 0 30px; }
  .statement em { font-style: normal; color: var(--gold); }
  .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; padding-top: 22px; border-top: 1px solid var(--line); }
  .facts div p:last-child { margin-top: 6px; color: var(--cream); }
  .project { display: grid; grid-template-columns: 300px 1fr; gap: 28px; padding: 26px 0; }
  .project:last-child { padding-bottom: 0; }
  .frame { border-radius: 10px; overflow: hidden; border: 1px solid rgba(201,168,106,.3); background: #0a0a0a; align-self: start; }
  .frame .bar { height: 20px; display: flex; gap: 5px; align-items: center; padding: 0 9px; border-bottom: 1px solid rgba(201,168,106,.18); }
  .frame .bar i { width: 6px; height: 6px; border-radius: 50%; background: rgba(201,168,106,.45); }
  .frame .shot { height: 168px; overflow: hidden; position: relative; }
  .frame .shot img { position: absolute; left: -2px; top: -2px; width: calc(100% + 4px); height: calc(100% + 4px); object-fit: cover; object-position: top; }
  .project .head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
  .project h3 { font-family: "Archivo", sans-serif; font-weight: 900; font-stretch: 115%; font-size: 25px; letter-spacing: -.02em; color: var(--cream); }
  .project .role { margin: 6px 0 10px; }
  .stackrow { display: grid; grid-template-columns: 170px 1fr; align-items: center; gap: 20px; padding: 16px 0; }
  .stackrow .pills { display: flex; flex-wrap: wrap; gap: 8px; }
  .stackrow:last-child { padding-bottom: 0; }
  .certs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 30px; }
  .cert { border: 1px solid var(--line); border-radius: 12px; padding: 12px 12px 16px; background: #0d0d0d; }
  .cert img { width: 100%; border-radius: 6px; display: block; }
  .cert p:nth-of-type(1) { margin-top: 12px; color: var(--cream); font-weight: 700; font-size: 14.5px; line-height: 1.35; }
  .cert p:nth-of-type(2) { margin-top: 6px; }
  .contactrow { display: grid; grid-template-columns: 170px 1fr; gap: 20px; align-items: center; padding: 15px 0; }
  .contactrow p:last-child { color: var(--cream); font-size: 16px; }
  .cta { display: inline-flex; align-items: center; gap: 12px; margin-top: 28px; height: 44px; padding: 0 24px; border-radius: 999px;
    background: var(--gold); color: #0a0a0a; font-weight: 700; }
</style>
</head>
<body>
<div class="card">
__BODY__
</div>
</body>
</html>
