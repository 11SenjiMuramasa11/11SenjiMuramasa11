<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Marcellus&display=block" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; }
  .card {
    position: relative;
    width: 1000px;
    height: 150px;
    border-radius: 14px;
    overflow: hidden;
    background: #0a0a0a;
    display: flex;
    align-items: center;
    gap: 22px;
    padding: 0 56px;
  }
  .frame { position: absolute; inset: 10px; border: 1px solid rgba(201,168,106,.14); border-radius: 6px; }
  .corner { position: absolute; width: 38px; height: 38px; color: #c9a86a; opacity: .75; }
  .corner svg { width: 100%; height: 100%; display: block; }
  .tl { top: -1px; left: -1px; }
  .tr { top: -1px; right: -1px; transform: scaleX(-1); }
  .bl { bottom: -1px; left: -1px; transform: scaleY(-1); }
  .br { bottom: -1px; right: -1px; transform: scale(-1); }
  .diamond { width: 9px; height: 9px; background: #c9a86a; transform: rotate(45deg); flex-shrink: 0; }
  h2 {
    font-family: "Marcellus", serif; font-weight: 400; font-size: 46px; line-height: 1;
    color: #f1f5f9; white-space: nowrap;
  }
  .rule { flex: 1; height: 1px; background: linear-gradient(90deg, rgba(201,168,106,.55), rgba(201,168,106,0)); }
</style>
</head>
<body>
<div class="card">
  <div class="frame">
    __CORNERS__
  </div>
  <span class="diamond"></span>
  <h2>__TITLE__</h2>
  <span class="rule"></span>
</div>
</body>
</html>
