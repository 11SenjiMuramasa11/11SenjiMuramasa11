<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@700&display=block" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; }
  /* Same as the portfolio's View CV pill; the dark fill keeps the gold readable on GitHub's light theme too. */
  .card {
    display: inline-flex; align-items: center; gap: 8px;
    height: 40px; padding: 0 20px;
    border: 1px solid #d9b66a; border-radius: 999px; background: #0e0e12;
    font-family: "Nunito Sans", sans-serif; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
    color: #f0dcab; white-space: nowrap;
  }
  .card svg { width: 14px; height: 14px; color: #d9b66a; }
</style>
</head>
<body>
<div class="card">__ICON____LABEL__</div>
</body>
</html>
