<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=block" rel="stylesheet" />
<style>
  /* Same tokens as the portfolio's dark theme (site/src/styles.css). */
  :root {
    --bg: #0e0e12; --fg: #fff; --gold: #d9b66a; --gold-hi: #f0dcab; --accent: #d0353f;
    --text-2: rgba(255,255,255,.74); --text-3: rgba(255,255,255,.62);
    --hair: rgba(255,255,255,.06); --zebra: rgba(255,255,255,.03); --gold-line: rgba(217,182,106,.22);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; }
  .card {
    position: relative; width: 1000px; padding: 46px 52px 50px;
    border-radius: 14px; background: var(--bg); overflow: hidden;
    font-family: "Nunito Sans", sans-serif; color: var(--text-2); font-size: 15px; line-height: 1.6;
  }
  /* thin gold frame + corner brackets, as on the portfolio */
  .frame { position: absolute; inset: 10px; border: 1px solid rgba(217,182,106,.16); border-radius: 6px; pointer-events: none; }
  .corner { position: absolute; width: 40px; height: 40px; color: var(--gold); opacity: .7; }
  .corner svg { width: 100%; height: 100%; display: block; }
  .tl { top: -1px; left: -1px; } .tr { top: -1px; right: -1px; transform: scaleX(-1); }
  .bl { bottom: -1px; left: -1px; transform: scaleY(-1); } .br { bottom: -1px; right: -1px; transform: scale(-1); }

  /* section bar: emblem, title, fading rule, meta */
  .secbar { display: flex; align-items: center; gap: 16px; padding-bottom: 22px; border-bottom: 1px solid var(--hair); margin-bottom: 30px; }
  .secbar .emblem { width: 26px; height: 26px; color: var(--gold); flex-shrink: 0; }
  .secbar h2 { font-weight: 800; font-size: 32px; letter-spacing: -.01em; color: var(--fg); line-height: 1; }
  .secbar .rule { flex: 1; height: 1px; background: linear-gradient(90deg, rgba(255,255,255,.12), transparent 70%); }
  .secbar .meta { font-size: 11.5px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--text-3); }

  .divider { height: 1px; background: linear-gradient(90deg, var(--gold) 0%, rgba(217,182,106,.2) 60%, transparent 100%); margin: 14px 0 16px; }
  .gold { color: var(--gold); }
  h3 { font-weight: 800; font-size: 26px; letter-spacing: -.01em; color: var(--fg); line-height: 1.15; }

  /* stat table (hero panel) */
  .stats { border-top: 1px solid var(--hair); }
  .stat { display: flex; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid var(--hair); font-size: 14.5px; }
  .stat:nth-child(even) { background: var(--zebra); }
  .stat span { color: rgba(255,255,255,.5); font-weight: 500; letter-spacing: .03em; }
  .stat b { color: var(--fg); font-weight: 700; }
  .quote { margin-top: 18px; padding-left: 14px; border-left: 2px solid var(--gold); font-style: italic; color: var(--gold); }

  /* about */
  .about { display: grid; grid-template-columns: 1fr 380px; gap: 44px; align-items: start; }
  .about .lead { font-weight: 800; font-size: 25px; line-height: 1.35; letter-spacing: -.01em; color: var(--fg); }
  .about .lead em { font-style: normal; color: var(--gold); }
  .about p.body { margin-top: 16px; }
  .about .role { font-weight: 700; color: var(--gold); font-size: 16px; }
  .about .sub { color: var(--text-3); font-size: 14px; margin-top: 2px; }

  /* projects */
  .works { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
  .shot { aspect-ratio: 16 / 10; border: 1px solid rgba(217,182,106,.28); border-radius: 4px; overflow: hidden; margin-bottom: 20px; }
  .shot img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  .meta-line { margin-top: 8px; font-size: 14px; color: var(--gold); }
  ul.details { padding-left: 18px; }
  ul.details li { margin-bottom: 6px; font-size: 14.5px; line-height: 1.55; }
  ul.details li::marker { color: var(--gold); }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .tag { font-size: 12px; padding: 3px 9px; border-radius: 4px; background: rgba(255,255,255,.05); border: 1px solid var(--hair); color: var(--text-2); }

  /* stack, talents style: category tab on the left, its skills on the right */
  .stack-wrap { margin-top: -30px; }
  .talent { display: grid; grid-template-columns: 270px 1fr; gap: 24px; align-items: center; padding: 15px 14px; border-bottom: 1px solid var(--hair); }
  .talent:nth-child(even) { background: var(--zebra); }
  .tab { display: flex; align-items: center; gap: 12px; font-size: 16px; font-weight: 700; color: var(--fg); }
  .tab .count { margin-left: auto; margin-right: 18px; font-size: 12px; font-weight: 600; color: var(--text-3); }
  .diamond { width: 9px; height: 9px; transform: rotate(45deg); flex-shrink: 0; border: 1.2px solid var(--gold); }
  .diamond.on { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 10px rgba(208,53,63,.55); }
  .skills { display: flex; flex-wrap: wrap; gap: 8px 22px; }
  .skill { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; color: var(--fg); white-space: nowrap; }
  .skill svg { width: 15px; height: 15px; }

  /* certifications */
  .certs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .cert { border: 1px solid rgba(255,255,255,.08); border-radius: 10px; overflow: hidden; background: rgba(255,255,255,.025); }
  .cert .img { aspect-ratio: 4 / 3; background: #26262a; display: grid; place-items: center; padding: 8px; }
  .cert .img img { max-width: 100%; max-height: 100%; display: block; }
  .cert .info { padding: 16px 18px 20px; }
  .cert h4 { font-weight: 800; font-size: 16px; color: var(--fg); line-height: 1.3; }
  .cert .by { display: flex; justify-content: space-between; gap: 10px; margin-top: 8px; font-size: 12.5px; }
  .cert .by span:last-child { color: var(--text-2); }
  .cert p { margin-top: 10px; font-size: 13px; line-height: 1.55; }

  /* contact */
  .contact h3 { font-size: 36px; }
  .contact .lead { margin-top: 8px; }
  .channels { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 26px; padding-bottom: 24px; border-bottom: 1px solid var(--hair); }
  .channel { padding: 0 22px; border-left: 1px solid var(--hair); }
  .channel:first-child { padding-left: 0; border-left: 0; }
  .channel .label { display: flex; align-items: center; gap: 9px; font-size: 13.5px; font-weight: 600; color: var(--text-2); }
  .channel .label svg { width: 17px; height: 17px; color: var(--gold); }
  .channel .val { margin-top: 12px; color: var(--fg); font-size: 15px; }
  .channel .go { margin-top: 12px; color: var(--gold); font-size: 14.5px; font-weight: 600; }
  .cta { display: table; margin: 22px auto 0; padding: 11px 24px; border-radius: 8px; border: 1px solid rgba(217,182,106,.45); background: rgba(217,182,106,.08);
    color: var(--gold-hi); font-weight: 700; font-size: 14.5px; }
</style>
</head>
<body>
<div class="card">
  <div class="frame">__CORNERS__</div>
__BODY__
</div>
</body>
</html>
